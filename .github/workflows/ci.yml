name: CI 

on:
  push:
    branches:
      - main

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v1
        with:
          php-version: 7.4
          extension: intl
          coverage: none

      - name: Setup MySQL
        run: mysql -uroot -p${{ secrets.MYSQL}} -e 'CREATE DATABASE test;'

      - run: ls -la